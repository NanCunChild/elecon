name: elecon
description: "校园信息聚合平台"
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # ADR-008/014：客户端 QuickJS 运行时。flutter_qjs_next 基于更新 QuickJS，
  # 保留 IsolateQjs/host-fn 通道，并去掉旧 flutter_qjs 的 KGP/ffi 1.x 阻塞。
  flutter_qjs_next:
    git:
      url: https://github.com/NanCunChild/flutter_qjs_es2023
      ref: f5f3611
  flutter_inappwebview: ^6.0.0
  # ADR-012 §2.8 三档加密（S 软件档）——纯 Dart AES-256-GCM AEAD。
  # 🔒 红线 #9：Apache-2.0；上游维护状态待 license/安全评审确认（社区 fork: cryptography_plus）。
  # TODO(依赖恢复)：flutter_qjs_next 已解除 ffi 1.x 冲突，可单独 PR 升级 cryptography。
  cryptography: ">=2.6.0 <2.7.0"
  # TODO(§2.8 落盘)：path_provider 提供 app 私有目录给 FileBlobStore。
  # BlobStore 已做成可注入接缝；后续单独加入 path_provider 后，在 main.dart 挂载
  # FileBlobStore(getApplicationSupportDirectory()) 即点亮持久化。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
