name: elecon
description: "校园信息聚合平台"
publish_to: none
# 本地构建的默认版本基线。CI 发版以 git tag 为准（release.yml 用 `--build-name`
# 覆盖为 tag 去掉 v 前缀、`--build-number` 用 run number），tag 与此处不必逐位同步。
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # ADR-008/014：客户端 QuickJS 运行时。固定 pub.dev 版本，避免 Git 依赖漂移。
  # 保留 IsolateQjs/host-fn 通道；升级时跑 host_fn/dual_run/fetch 测试。
  # 1.1.1：修复部分（请求体/句柄）泄露问题（2026-07-20 人工授权升级）。
  flutter_qjs_next: 1.2.1
  flutter_inappwebview: ^6.0.0
  # ADR-012 §2.8 三档加密（S 软件档）——纯 Dart AES-256-GCM AEAD；亦承 loader 验签
  # （Ed25519）与 digest（DartSha256）。承重且横跨凭证+验签两条路径。
  # 🔒 红线 #9：Apache-2.0；上游维护状态待 license/安全评审确认——评审未结前**精确 pin**
  # （与 flutter_qjs_next 同策略），不用 caret，避免 `pub upgrade` 把承重 crypto 漂到未评审版本。
  cryptography: 2.9.0
  # ADR-028：声明式加密算子 md5/sha1/sha256 裸摘要（bind/compute 数据流，broker 侧执行、
  # adapter 不见值）。Dart 官方 crypto，同步 Hash API、与 node:crypto 共享 NIST 向量→双跑一致。
  # 🔒 红线 #9：BSD-3-Clause；已在依赖树（transitive，经 path_provider/hooks），此处提为 direct 并精确 pin。
  crypto: 3.0.7
  # ADR-028：声明式 aes-cbc 算子的同步块加密（core 侧执行、adapter 不见值/不见密钥）。
  # cryptography 的 AES 为异步且强制 PKCS7+SecretBox（表达不了 padding:none），故用 pointycastle
  # 的同步 CBCBlockCipher+AESEngine。标准算法→与 node:crypto 共享 NIST 向量、双跑逐字节一致。
  # 🔒 红线 #9：MIT 系（Legion of the Bouncy Castle），非 GPL——待 license/安全评审确认。
  #    精确 pin（同 cryptography/crypto 策略，避免 pub upgrade 把承重 crypto 漂到未评审版本）。
  pointycastle: 3.9.1
  # ADR-012 §2.8：app 私有目录给 FileBlobStore；Android 同步配 allowBackup=false + 备份排除。
  path_provider: ^2.1.5
  # contract/schema 生成的 Dart 类型（tools codegen 产物包；审阅 P0-1 接线）。
  # UI 模型消费此包，消除手写模型与 schema 的漂移（红线 #6 契约单源）。
  elecon_contract:
    path: ../contract/generated/dart
  # 实验性液态玻璃导航 chrome（iOS 26 风格 shader 毛玻璃）。MIT。
  # 仅 UI 层；高对比模式走 Material 回退，不参与凭证/adapter 路径。
  liquid_glass_widgets: 0.22.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/bootstrap/
    - assets/bootstrap/bundles/
    - assets/stdlib/html.bundle.js
