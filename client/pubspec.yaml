name: elecon
description: "校园信息聚合平台"
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # ADR-008/014：客户端 QuickJS 运行时。固定 pub.dev 版本，避免 Git 依赖漂移。
  # 保留 IsolateQjs/host-fn 通道；升级时跑 host_fn/dual_run/fetch 测试。
  flutter_qjs_next: 1.0.2
  flutter_inappwebview: ^6.0.0
  # ADR-012 §2.8 三档加密（S 软件档）——纯 Dart AES-256-GCM AEAD。
  # 🔒 红线 #9：Apache-2.0；上游维护状态待 license/安全评审确认。
  cryptography: ^2.9.0
  # ADR-012 §2.8：app 私有目录给 FileBlobStore；Android 同步配 allowBackup=false + 备份排除。
  path_provider: ^2.1.5
  # contract/schema 生成的 Dart 类型（tools codegen 产物包；审阅 P0-1 接线）。
  # UI 模型消费此包，消除手写模型与 schema 的漂移（红线 #6 契约单源）。
  elecon_contract:
    path: ../contract/generated/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
