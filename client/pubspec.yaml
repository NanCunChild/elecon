name: elecon
description: "校园信息聚合平台"
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_qjs: ^0.3.7
  flutter_inappwebview: ^6.0.0
  # ADR-012 §2.8 三档加密（S 软件档）——纯 Dart AES-256-GCM AEAD。
  # 🔒 红线 #9：Apache-2.0；上游维护状态待 license/安全评审确认（社区 fork: cryptography_plus）。
  # 钉 2.6.x：cryptography ≥2.7 依赖 ffi ^2.1，与 flutter_qjs fork 的 ffi ^1.0 冲突。
  cryptography: ">=2.6.0 <2.7.0"

# flutter_qjs 0.3.7（ekibun，已停更）在 Dart 3.12 下编译失败：FFI 回调
# channelDispacher 返回可空指针，而 Pointer.fromFunction 要求非空。
# fork 打了一行补丁（lib/src/ffi.dart：返回类型去掉 ?，函数体 ... ?? nullptr）
# 并 vendoring QuickJS 源（pub 不为 git 依赖初始化 submodule）。
# 补丁分支：https://github.com/NanCunChild/flutter_qjs/tree/dart3-compat
# 详见 docs/adr/adr_008_client_runtime.md §3。
dependency_overrides:
  flutter_qjs:
    git:
      url: https://github.com/NanCunChild/flutter_qjs.git
      ref: dbf5c17233c3c8abfbfa707c297121bb86e54e83

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
