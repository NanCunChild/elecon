name: elecon
description: "校园信息聚合平台"
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # ADR-008/014：客户端 QuickJS 运行时。flutter_qjs_next 基于更新 QuickJS，
  # 保留 IsolateQjs/host-fn 通道，并去掉旧 flutter_qjs 的 KGP/ffi 1.x 阻塞。
  flutter_qjs_next:
    git:
      url: https://github.com/NanCunChild/flutter_qjs_es2023
      ref: f5f3611
  flutter_inappwebview: ^6.0.0
  # ADR-012 §2.8 三档加密（S 软件档）——纯 Dart AES-256-GCM AEAD。
  # 🔒 红线 #9：Apache-2.0；上游维护状态待 license/安全评审确认。
  cryptography: ^2.9.0
  # ADR-012 §2.8：app 私有目录给 FileBlobStore；Android 同步配 allowBackup=false + 备份排除。
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
