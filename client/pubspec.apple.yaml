name: elecon
description: "校园信息聚合平台（iOS/macOS 液态玻璃构建）"
publish_to: none
version: 0.10.1+18

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_qjs_next: 1.2.1
  # Same shared browser API as Android; official Apache-2.0 release.
  flutter_inappwebview: 6.2.0-beta.3
  cryptography: 2.9.0
  crypto: 3.0.7
  pointycastle: 3.9.1
  path_provider: ^2.1.5
  # Same script import surface as the default manifest; MIT (ADR-034).
  file_picker: 13.1.0
  # ADR-045: foreground QR camera; pub.dev / juliansteenbakker/mobile_scanner, BSD-3-Clause.
  mobile_scanner: 7.4.3
  # ADR-058: foreground photo selection/capture (Flutter, BSD-3-Clause).
  image_picker: 1.2.4
  # ADR-058: foreground location (Baseflow, MIT).
  geolocator: 14.0.2
  # ADR-061: host-only SQLite in a memory VFS; protected snapshots. pub.dev, MIT.
  sqlite3: 3.3.4
  # ADR-062: Dart-owned native Hermes control bridge, dart.dev, BSD-3-Clause.
  ffi: 2.2.0
  # ADR-084: shared phone-directory dialer; Flutter official BSD-3-Clause.
  url_launcher: 6.3.3
  elecon_contract:
    path: ../contract/generated/dart
  # Apple-only UI chrome. MIT; does not participate in credential/adapter paths.
  liquid_glass_widgets: 0.22.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/school-scripts/
    - assets/bootstrap/
    - assets/bootstrap/bundles/
    - assets/stdlib/html.bundle.js
    - assets/native/hermes/LICENSE
    - assets/native/hermes/THIRD_PARTY_NOTICES.txt
