name: CI

# 把三条验证链做成必过闸门（git.md §3：契约一致性 / adapter 静态校验 / 夹具回归 / lint）。
on:
  push:
    branches: [main, V2]
  pull_request:
    branches: [main, V2]
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit SHA to verify; release callers must provide the preflight SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  v2-docs-structure:
    name: V2 / docs structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Verify active V2 and frozen V1 documentation
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/adr/README.md
          test -f docs/adr/adr_000_abstract.md
          test -f docs/adr/archived/v1/README.md
          test -f docs/notes/README.md
          test -f docs/notes/archived/v1/README.md
          test -f docs/planning/README.md
          test -f docs/planning/v2_migration.md
          test -f docs/planning/archived/v1/README.md
          test -f docs/probes/README.md
          test -f docs/probes/archived/v1/README.md
          test -f docs/reference/README.md
          test -f docs/reference/archived/v1/README.md

          set -- docs/adr/archived/v1/adr_*.md
          test "$#" -eq 34 || {
            printf 'expected 34 frozen V1 ADRs, got %s\n' "$#" >&2
            exit 1
          }

          set -- docs/adr/adr_*.md
          test "$#" -eq 10 || {
            printf 'expected V2 ADR-000 through ADR-009, got %s files\n' "$#" >&2
            exit 1
          }

          for filename in \
            adr_001_contract.md \
            adr_002_trust_model.md \
            adr_022_request_graph.md \
            adr_023_declarative_dataflow.md \
            adr_026_response_masker.md \
            adr_033_production_sideload.md; do
            test ! -e "docs/adr/$filename" || {
              printf 'V1 ADR remains active: docs/adr/%s\n' "$filename" >&2
              exit 1
            }
          done

  # lint + 全 workspace 严格类型：Biome（server/tools/packages/scripts + adapters 一方 JS，
  # 规则取舍见 biome.jsonc）+ tsc --noEmit（含共享包 @elecon/broker-primitives）。
  # npm ci 在仓库根（workspace）执行，共享包经 prepare 自动构建。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      # pkcs11js 仅离线签名机需要；普通 CI 必须在省略 optional 原生模块时仍可编译 tools。
      - run: npm ci --omit=optional && npm run typecheck -w tools

  # 迁移期服务端 baseline：目录发现运行当前全部 runtime/Broker/transport smoke。
  # V2 替代 gate 落地前保留，避免通过重启 ADR 静默丢失已实现的回归覆盖。
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      # 按需拉取公开仓 elecon-adapters 的 adapters/（ADR-018 §2.11.1，取代 git 子模块）。
      # 脚本按 adapters.pin 钉死的 ref 浅克隆，并导出 runtime/validator 共用的根目录。
      - name: Fetch pinned elecon-adapters
        run: bash scripts/fetch-adapters.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w server
      - run: npm run build -w server
      - name: Legacy baseline / current server smoke suite
        run: npm run smoke:all -w server
        env:
          ELECON_REQUIRE_ADAPTERS: "1"
      - run: bash deploy/public-endpoint/validate-dist.test.sh

  # 迁移期工具链 baseline：全量 smoke、adapter 校验、扫描与 codegen 漂移闸门。
  # Manifest V2 gate 落地后逐项替换旧 validator 断言，不先删除。
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      # 按需拉取 elecon-adapters（ADR-018 §2.11.1）；脚本导出的 ELECON_ADAPTERS_ROOT
      # 让 validate 对 pinned checkout 的 adapters/ 做全量静态校验。
      - name: Fetch pinned elecon-adapters
        run: bash scripts/fetch-adapters.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w tools
      - name: Legacy baseline / current tools smoke suite
        run: npm run smoke:all -w tools
      - run: npm run ledger:validate -w tools
      # 红线 #8：提交的 adapter 与 fixture 不得包含真实学生数据或凭证等价物。
      - run: npm run scan -w tools
      - name: Legacy baseline / current adapter validation
        run: npm run validate -w tools
      # codegen 漂移闸门（仿 stdlib bundle 闸门）：入库生成物必须等于按当前
      # contract/schema 重新生成的产物——schema 改了、生成物没跟上即 fail。
      # 生成物已被消费（client elecon_contract 包 / server 类型化 smoke），漂移会伤下游。
      - name: 入库 codegen 产物必须等于按 schema 重新生成的产物
        run: npm run codegen -w tools && git diff --exit-code contract/generated
      - name: Bootstrap assets must match the canonical checked-in dist
        run: npm run bootstrap:check -w tools

  # stdlib：vendored html.bundle.js 可复现性闸门。在干净环境按锁定依赖重建，
  # 与入库 bundle 做 git diff 比对；V2 客户端 runtime 继续加载 exact bundle。
  stdlib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/_stdlib
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adapters/_stdlib/package-lock.json
      - run: npm ci
      - run: node build.mjs
      - name: 入库 bundle 必须等于按锁定依赖重建的产物
        run: git diff --exit-code html.bundle.js

  # 迁移期客户端 baseline：lint、当前 trust profile、QuickJS 和 fixture/legacy golden。
  # flutter_qjs 是经典 FFI 插件，需先用 CMake 预构建原生测试库（见 build 脚本）。
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      # 按需拉取 elecon-adapters；客户端 fixture replay 使用其 school-* 脱敏样本。
      - name: Fetch pinned elecon-adapters
        working-directory: ${{ github.workspace }}
        run: bash scripts/fetch-adapters.sh
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # 默认轮次 = DEPLOY profile（无 dart-define）：断言 ADR-024 护栏 1 的 fail-closed
      # 默认，以及 devSideload() 在 DEPLOY 下恒抛。需侧载信任票的用例在此轮 skip。
      - name: Legacy baseline / Flutter tests with current DEPLOY profile
        run: bash tool/flutter_test.sh flutter test
        env:
          ELECON_REQUIRE_ADAPTERS: "1"
      # DEV profile 轮次：执行上一轮 skip 掉的侧载路径用例（imperative 运行时集成）。
      # 两轮合起来才覆盖 ADR-024 的两个信任档——少任一轮都会留下未被断言的分支。
      - name: Legacy baseline / Flutter tests with current DEV sideload profile
        run: >-
          bash tool/flutter_test.sh flutter test
          --dart-define=ELECON_TRUST_PROFILE=dev-sideload
        env:
          ELECON_REQUIRE_ADAPTERS: "1"
      - name: Test Apple-only liquid glass graph
        run: bash tool/with_apple_pubspec.sh flutter test test_apple/liquid_glass_test.dart
      - name: Test release artifact rejection
        run: bash tool/check_release_gate_test.sh
      # 快门：main Manifest 必须含 INTERNET（曾只写在 debug/profile → release 无法登录）
      - name: Release static gate (Android INTERNET)
        run: bash tool/check_release_gate.sh --static-only

  # release APK 构建阀门：静态检查 + 真编 release + aapt 核对 INTERNET。
  # 与 client 测并行；失败 = 禁止合入（防止 debug-only 配置泄漏进 release）。
  client-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release build gate (apk + INTERNET)
        run: bash tool/check_release_gate.sh

  # Android 模拟器关键流程门：脱敏 fixture + 注入边界，不访问任何学校接口。
  # 入口仍运行真实 EleconApp/启动门/选校页/主壳/首页，仅替换登录与首页数据 I/O。
  client-android-emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the real app flow harness
        run: flutter build apk --debug --target tool/android_emulator_flow_app.dart
      - name: Run startup, school, login, and home error flow
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r client/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W dev.nancunchild.elecon/.MainActivity
            python3 client/tool/android_emulator_flow.py
