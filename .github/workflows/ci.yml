name: CI

# 把三条验证链做成必过闸门（git.md §3：契约一致性 / adapter 静态校验 / 夹具回归 / lint）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit SHA to verify; release callers must provide the preflight SHA
        required: false
        type: string
      release_gate:
        description: true = 发版门（P3-08）按 release 语义硬失败（revocation 过期即拒）；PR CI 缺省只告警
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # lint + 全 workspace 严格类型：Biome（server/tools/packages/scripts + adapters 一方 JS，
  # 规则取舍见 biome.jsonc）+ tsc --noEmit（含共享包 @elecon/broker-primitives）。
  # npm ci 在仓库根（workspace）执行，共享包经 prepare 自动构建。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      # pkcs11js 仅离线签名机需要；普通 CI 必须在省略 optional 原生模块时仍可编译 tools。
      - run: npm ci --omit=optional && npm run typecheck -w tools

  # 服务端：全量 golden 冒烟（目录发现；沙箱 parser 端到端/超时/OOM/缺能力 + Broker B1–B6
  # + 凭证 + transport + fetch/xjt）。golden 向量钉死两端双跑行为；漏跑 = TS 侧可静默漂移
  # 而 Dart 侧（flutter test 全量）仍被门住，破坏双跑一致性的强制对称（ADR-001 §8）。
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      # 按需拉取公开仓 elecon-adapters 的 adapters/（ADR-018 §2.11.1，取代 git 子模块）。
      # 脚本按 adapters.pin 钉死的 ref 浅克隆，并导出 runtime/validator 共用的根目录。
      - name: Fetch pinned elecon-adapters
        run: bash scripts/fetch-adapters.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w server
      - run: npm run build -w server
      - run: npm run smoke:all -w server
        env:
          ELECON_REQUIRE_ADAPTERS: "1"
      - run: bash deploy/public-endpoint/validate-dist.test.sh

  # 工具链：全量 smoke（目录发现，含 validator/urlmatch/scanner/codegen/signer——此前手工
  # 列举漏跑了后三个）+ 对 adapters/ 全量静态校验 + codegen 漂移闸门。
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          # 契约 changelog 门要对 base（origin/main）做 merge-base diff；默认 fetch-depth=1 的浅克隆
          # 没有 origin/main → 门在 PR 上直接报「找不到 base ref」而红（push 到 main 时 base==HEAD、
          # 零差异假绿）。全历史让该门在 PR 上真正生效。
          fetch-depth: 0
      # 按需拉取 elecon-adapters（ADR-018 §2.11.1）；脚本导出的 ELECON_ADAPTERS_ROOT
      # 让 validate 对 pinned checkout 的 adapters/ 做全量静态校验。
      - name: Fetch pinned elecon-adapters
        run: bash scripts/fetch-adapters.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w tools
      - run: npm run smoke:all -w tools
      - run: npm run ledger:validate -w tools
      # 红线 #8：提交的 adapter 与 fixture 不得包含真实学生数据或凭证等价物。
      - run: npm run scan -w tools
      - run: npm run validate -w tools
      # ADR-001 §8 放行条件②的机器校验：改了 contract/ 就必须在
      # contract/CHANGELOG.md 留一条引用了 ADR 编号的记录（红线 #6「先有 ADR」）。
      - name: Contract changelog reference gate
        run: npm run check:contract-changelog -w tools
      # codegen 漂移闸门（仿 stdlib bundle 闸门）：入库生成物必须等于按当前
      # contract/schema 重新生成的产物——schema 改了、生成物没跟上即 fail。
      # 生成物已被消费（client elecon_contract 包 / server 类型化 smoke），漂移会伤下游。
      - name: 入库 codegen 产物必须等于按 schema 重新生成的产物
        run: npm run codegen -w tools && git diff --exit-code contract/generated
      # bootstrap 是唯一入库的签名产物（dist 树不入库，上传前由 dist:export 反向导出）。
      # 门：catalog ↔ bundles ↔ envelope digest 自洽，且无游离字节随 app 发布。
      - name: Bootstrap assets must be self-consistent
        run: npm run bootstrap:verify -w tools
      # 发版门（P3-08）：bootstrap 的 catalog/revocation 以客户端预埋锚真实验签、sequence 不得低于台账、
      # 每个 entry 必须入账、下次 revocation 输入不得倒退或改内容未 bump、kill-switch 不得随包。
      # PR CI 里 revocation 过期只告警（免得每个 PR 被 7 天 TTL 打红）；release 工作流传 release_gate=true 硬失败。
      - name: Release gate（sequence 单调 / 新鲜度 / 台账）
        run: npm run release:gate -w tools -- --stale-revocation=${{ inputs.release_gate && 'error' || 'warn' }}

  # stdlib：vendored html.bundle.js 可复现性闸门（#16）。在干净环境按锁定依赖重建，
  # 与入库 bundle 做 git diff 比对——不一致即 fail。bundle 是两端 QuickJS 实际加载的
  # 解析器源码，漂移 = 双跑 golden 可能飘且无人察觉（ADR-011 §2.3 版本锁定即契约 / 红线 #9）。
  stdlib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/_stdlib
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adapters/_stdlib/package-lock.json
      - run: npm ci
      - run: node build.mjs
      - name: 入库 bundle 必须等于按锁定依赖重建的产物
        run: git diff --exit-code html.bundle.js

  # 客户端：lint + 双跑一致性（客户端 QuickJS == golden）。
  # flutter_qjs 是经典 FFI 插件，需先用 CMake 预构建原生测试库（见 build 脚本）。
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      # 按需拉取 elecon-adapters（ADR-018 §2.11.1）；flutter test 双跑用其 school-* fixtures。
      - name: Fetch pinned elecon-adapters
        working-directory: ${{ github.workspace }}
        run: bash scripts/fetch-adapters.sh
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # 默认轮次 = DEPLOY profile（无 dart-define）：断言 ADR-024 护栏 1 的 fail-closed
      # 默认，以及 devSideload() 在 DEPLOY 下恒抛。需侧载信任票的用例在此轮 skip。
      - name: Flutter tests with native QuickJS (DEPLOY profile)
        run: bash tool/flutter_test.sh flutter test
        env:
          ELECON_REQUIRE_ADAPTERS: "1"
      # DEV profile 轮次：执行上一轮 skip 掉的侧载路径用例（imperative 运行时集成）。
      # 两轮合起来才覆盖 ADR-024 的两个信任档——少任一轮都会留下未被断言的分支。
      - name: Flutter tests with native QuickJS (DEV sideload profile)
        run: >-
          bash tool/flutter_test.sh flutter test
          --dart-define=ELECON_TRUST_PROFILE=dev-sideload
        env:
          ELECON_REQUIRE_ADAPTERS: "1"
      - name: Test Apple-only liquid glass graph
        run: bash tool/with_apple_pubspec.sh flutter test test_apple/liquid_glass_test.dart
      - name: Test release artifact rejection
        run: bash tool/check_release_gate_test.sh
      # 快门：main Manifest 必须含 INTERNET（曾只写在 debug/profile → release 无法登录）
      - name: Release static gate (Android INTERNET)
        run: bash tool/check_release_gate.sh --static-only

  # release APK 构建阀门：静态检查 + 真编 release + aapt 核对 INTERNET。
  # 与 client 测并行；失败 = 禁止合入（防止 debug-only 配置泄漏进 release）。
  client-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release build gate (apk + INTERNET)
        run: bash tool/check_release_gate.sh

  # Android 模拟器关键流程门：脱敏 fixture + 注入边界，不访问任何学校接口。
  # 入口仍运行真实 EleconApp/启动门/选校页/主壳/首页，仅替换登录与首页数据 I/O。
  client-android-emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the real app flow harness
        run: flutter build apk --debug --target tool/android_emulator_flow_app.dart
      # ubuntu-latest runner 默认不给当前用户 /dev/kvm 权限（日志：ProbeKVM ... doesn't have
      # permissions），x86_64 模拟器无硬件加速 → adb 永远连不上（2026-08-27 起 main 持续红）。
      # 这是 android-emulator-runner 官方 README 要求的前置步骤。
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run startup, school, login, and home error flow
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r client/build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W dev.nancunchild.elecon/.MainActivity
            python3 client/tool/android_emulator_flow.py
