name: CI

# 把三条验证链做成必过闸门（git.md §3：契约一致性 / adapter 静态校验 / 夹具回归 / lint）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 服务端：TS 严格类型 + 全量 golden 冒烟（沙箱 parser 端到端/超时/缺能力 + Broker B1–B6 + 凭证 + transport + fetch/xjt）。
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 全量 golden 闸门：Broker B1–B6 + 凭证 + transport + fetch/xjt 端到端。
      # 这些 golden 向量钉死两端双跑行为；漏跑 = TS 侧可静默漂移而 Dart 侧（flutter test 全量）
      # 仍被门住，破坏双跑一致性的强制对称（ADR-001 §8）。
      - run: npm run smoke:all

  # 工具链：TS 严格类型 + 校验器自测 + 对 adapters/ 全量静态校验（CI 闸门）。
  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke:validator
      - run: npm run smoke:urlmatch
      - run: npm run validate

  # stdlib：vendored html.bundle.js 可复现性闸门（#16）。在干净环境按锁定依赖重建，
  # 与入库 bundle 做 git diff 比对——不一致即 fail。bundle 是两端 QuickJS 实际加载的
  # 解析器源码，漂移 = 双跑 golden 可能飘且无人察觉（ADR-011 §2.3 版本锁定即契约 / 红线 #9）。
  stdlib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/_stdlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: adapters/_stdlib/package-lock.json
      - run: npm ci
      - run: node build.mjs
      - name: 入库 bundle 必须等于按锁定依赖重建的产物
        run: git diff --exit-code html.bundle.js

  # 客户端：lint + 双跑一致性（客户端 QuickJS == golden）。
  # flutter_qjs 是经典 FFI 插件，需先用 CMake 预构建原生测试库（见 build 脚本）。
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build flutter_qjs FFI test lib
        run: bash tool/build_qjs_test_lib.sh
      - run: flutter analyze
      - run: flutter test
