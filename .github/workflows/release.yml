name: Release Flutter artifacts

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  # 发版闸门：tag 推送不触发 flutter-ci（它只跑 main 分支与 PR），故在此复跑
  # analyze + test。任一失败即阻断 build/publish——绝不发出未过测试的产物。
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build QuickJS test library
        run: ./tool/build_qjs_test_lib.sh
      - name: Test
        run: flutter test

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      # OHOS/HAP 刻意不在发版矩阵内：主线依赖已迁 flutter_qjs_next，OHOS 旁路仍用
      # 旧 flutter_qjs fork（pubspec.ohos.yaml），需单独验证后再纳入，见
      # docs/notes/build_blockers.md §2。
      matrix:
        include:
          - name: android-v7a
            platform: android
            runner: ubuntu-latest
          - name: android-v8a
            platform: android
            runner: ubuntu-latest
          - name: windows
            platform: windows
            runner: windows-latest
          - name: linux
            platform: linux
            runner: ubuntu-latest
          - name: macos
            platform: macos
            runner: macos-14
          - name: ios
            platform: ios
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Install dependencies
        run: flutter pub get

      # 仓库只提交了 android/ios/linux 平台目录；macos/windows 的 runner 未入库。
      # flutter build 不会自动补平台目录，故按需脚手架（目录已存在则跳过）。
      - name: Ensure desktop platform scaffold
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        shell: bash
        run: |
          if [ ! -d "${{ matrix.platform }}" ]; then
            echo "缺少 ${{ matrix.platform }}/ 平台目录 → flutter create 脚手架"
            flutter create --no-pub --platforms=${{ matrix.platform }} --project-name elecon .
          fi

      - name: Create Android signing files
        if: matrix.platform == 'android'
        working-directory: .
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is required'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > client/android/upload-keystore.jks
          cat > client/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android APK
        if: matrix.platform == 'android'
        env:
          # 发布信号：缺 key.properties 时让 gradle fail（绝不发布 debug 签名 APK）。
          # 上一步已从 secrets 落 key.properties，此处双保险。CI 门禁不置此变量 → 回退 debug 签名。
          ELECON_REQUIRE_RELEASE_SIGNING: "true"
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-name "${RELEASE_TAG#v}" --build-number "$GITHUB_RUN_NUMBER"

      - name: Select Android ABI artifact
        if: matrix.platform == 'android'
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            android-v7a) abi=armeabi-v7a ;;
            android-v8a) abi=arm64-v8a ;;
          esac
          mkdir -p ../release-artifacts
          cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../release-artifacts/elecon-${{ matrix.name }}-${RELEASE_TAG#v}.apk"

      - name: Build Windows package
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          flutter build windows --release --build-name "${RELEASE_TAG#v}" --build-number "$GITHUB_RUN_NUMBER"
          7z a "$GITHUB_WORKSPACE/elecon-windows-${RELEASE_TAG#v}.zip" build/windows/x64/runner/Release/*

      - name: Build Linux package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          flutter build linux --release --build-name "${RELEASE_TAG#v}" --build-number "$GITHUB_RUN_NUMBER"
          tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/elecon-linux-${RELEASE_TAG#v}.tar.gz" bundle

      # macOS 签名渠道：配了证书 secrets 就 codesign，否则产出未签名 .app（现状）。
      # 未签名包用户侧会被 Gatekeeper 拦（需右键打开）；公证（notarization）待后续接入。
      - name: Build macOS package
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          flutter build macos --release --build-name "${RELEASE_TAG#v}" --build-number "$GITHUB_RUN_NUMBER"
          APP="build/macos/Build/Products/Release/elecon.app"
          if [ -n "$MACOS_CERTIFICATE_BASE64" ] && [ -n "$MACOS_SIGN_IDENTITY" ]; then
            echo "检测到 macOS 签名证书 → codesign（identity: $MACOS_SIGN_IDENTITY）"
            KEYCHAIN="$RUNNER_TEMP/elecon-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"
            CERT_PATH="$RUNNER_TEMP/macos-cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
            security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            # 把临时 keychain 并入搜索域，让 codesign 能找到导入的私钥。
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            rm -f "$CERT_PATH"
            security delete-keychain "$KEYCHAIN"
          else
            echo "未配置 macOS 签名证书 → 产出未签名 .app（Gatekeeper 将告警）"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/elecon-macos-${RELEASE_TAG#v}.zip"

      - name: Build unsigned iOS package
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign --build-name "${RELEASE_TAG#v}" --build-number "$GITHUB_RUN_NUMBER"
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "$GITHUB_WORKSPACE/elecon-ios-${RELEASE_TAG#v}-unsigned.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elecon-${{ matrix.name }}
          path: |
            elecon-*.zip
            elecon-*.tar.gz
            release-artifacts/elecon-*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: elecon-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/**
