[workspace]
members = [".","vendor/hermes/crates/atrust-auth","vendor/hermes/crates/atrust-client","vendor/hermes/crates/atrust-l3","vendor/hermes/crates/atrust-protocol","vendor/hermes/crates/atrust-tcp","vendor/hermes/crates/hermes-events","vendor/hermes/crates/hermes-model","vendor/hermes/crates/hermes-transport"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.88"
base64 = "0.22.1"
clap = { version = "4.5.37", features = ["derive"] }
futures-util = "=0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
rand = "0.9.1"
reqwest = { version = "0.12.15", default-features = false, features = ["cookies", "rustls-tls", "stream"] }
rsa = "0.9.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
url = "2.5.4"
zeroize = "1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"

[package]
name = "elecon-hermes-app-tunnel"
version = "0.1.0"
edition.workspace = true
license = "MIT"
publish = false

[lib]
name = "elecon_hermes"
crate-type = ["cdylib", "rlib"]

[dependencies]
atrust-auth = { path = "vendor/hermes/crates/atrust-auth" }
atrust-client = { path = "vendor/hermes/crates/atrust-client" }
hermes-model = { path = "vendor/hermes/crates/hermes-model" }
hermes-transport = { path = "vendor/hermes/crates/hermes-transport" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
zeroize.workspace = true
url.workspace = true
libc = "0.2"

[profile.release]
strip = true
panic = "abort"

[dev-dependencies]
async-trait.workspace = true
rustls = { version = "0.23.28", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "tls12"] }
sha2.workspace = true
