# 公网端点 D —— 静态分发（ADR-018 §2.1 D / §2.9；红线 #2 零凭证/无状态）。
# 只发 dist/ 里预先构建的已签名产物;不验签(客户端职责)、不持状态/凭证。

server {
    listen 80;
    server_name _;
    root /srv/dist;
    autoindex off;
    server_tokens off;

    # 只允许 GET / HEAD（分发是只读的）。
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","stateless":true,"zeroCredential":true}';
    }

    # 内容寻址 bundle：immutable 长缓存。原样 gzip 字节（不设 Content-Encoding）。
    location /bundles/ {
        default_type application/gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # catalog：短缓存（新鲜度靠内部 sequence/TTL）。
    location = /catalog.json.gz {
        default_type application/gzip;
        add_header Cache-Control "public, max-age=60";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # revocation：短缓存。
    location = /revocation.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=60";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # 其余一律 404（不暴露目录、不发未知路径）。
    location / { return 404; }
}
